<link rel="stylesheet" href="ColorStyle.css">
<head>
    <title>Order Now!</title>
</head>
<body>
    <div class="container">
        <h1>W Food</h1>
        <form action="thankyou.html" method="get">
            <label for="custname">Your Name:</label>
            <input type="text" name="custname" id="custname" required>

    <div class="row">
    <div> 
            <label for="phone">Phone Number:</label>
            <span>+65</span>
            <input type="tel" name="phone" id="phone" required maxlength="8" title="Please enter a valid 8-digit Singapore number.">
    </div>
    <div>
            <label for="email">E-mail:</label><br>
            <input type="email" name="email" id="email" required placeholder="you@example.com">
    </div>
    </div>

    <div class="column">
    <div>
            <h2>Main Meals</h2>
            <table>
                <tr>
                    <td><input type="checkbox" name="meal" value="Signature Burger"></td>
                    <td><img src="SignatureBurger.jpg" alt="Signature Burger" width="90" height="90"></td>
                    <td>Signature Burger</td>
                    <td><input type="number" name="meal_qty_burger" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="meal" value="Chicken Chop"></td>
                    <td><img src="ChickenChop.jpg" alt="Chicken Chop" width="90" height="90"></td>
                    <td>Chicken Chop</td>
                    <td><input type="number" name="meal_qty_chop" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="meal" value="Grilled Chicken Wrap"></td>
                    <td><img src="GrilledChickenWrap.jpg" alt="Grilled Chicken Wrap" width="90" height="90"></td>
                    <td>Chicken Wrap</td>
                    <td><input type="number" name="meal_qty_wrap" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="meal" value="Loaded Fries"></td>
                    <td><img src="LoadedFries.jpg" alt="Loaded Fries" width="90" height="90"></td>
                    <td>Loaded Fries</td>
                    <td><input type="number" name="meal_qty_fries" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="meal" value="Spaghetti Bolognese"></td>
                    <td><img src="SpaghettiBolognese.jpg" alt="Spaghetti Bolognese" width="90" height="90"></td>
                    <td>Spaghetti</td>
                    <td><input type="number" name="meal_qty_pasta" min="1" max="10" value="1"></td>
                </tr>
            </table>
    </div>

    <div>
            <h2>Drinks</h2>
            <table>
                <tr>
                    <td><input type="checkbox" name="drink" value="Coke"></td>
                    <td><img src="CocaCola.jpg" alt="Coke" width="90" height="90"></td>
                    <td>Coca-Cola</td>
                    <td><input type="number" name="drink_qty_coke" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="drink" value="Sprite"></td>
                    <td><img src="Sprite.jpg" alt="Sprite" width="90" height="90"></td>
                    <td>Sprite</td>
                    <td><input type="number" name="drink_qty_sprite" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="drink" value="Pepsi"></td>
                    <td><img src="Pepsi.jpg" alt="Pepsi" width="90" height="90"></td>
                    <td>Pepsi</td>
                    <td><input type="number" name="drink_qty_pepsi" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="drink" value="Iced Lemon Tea"></td>
                    <td><img src="IcedLemonTea.jpg" alt="Iced Lemon Tea" width="90" height="90"></td>
                    <td>Iced Lemon Tea</td>
                    <td><input type="number" name="drink_qty_tea" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="drink" value="Water"></td>
                    <td><img src="Water.jpg" alt="Water" width="90" height="90"></td>
                    <td>Water</td>
                    <td><input type="number" name="drink_qty_water" min="1" max="10" value="1"></td>
                </tr>
            </table>
    </div>

    <div>
            <h2>Sides</h2>
            <table>
                <tr>
                    <td><input type="checkbox" name="side" value="Garlic Bread"></td>
                    <td><img src="GarlicBread.jpg" alt="Garlic Bread" width="90" height="90"></td>
                    <td>Garlic Bread</td>
                    <td><input type="number" name="side_qty_garlic" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="side" value="Onion Rings"></td>
                    <td><img src="OnionRings.jpg" alt="Onion Rings" width="90" height="90"></td>
                    <td>Onion Rings</td>
                    <td><input type="number" name="side_qty_onion" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="side" value="Mashed Potato"></td>
                    <td><img src="MashedPotato.jpg" alt="Mashed Potato" width="90" height="90"></td>
                    <td>Mashed Potato</td>
                    <td><input type="number" name="side_qty_potato" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="side" value="Fries"></td>
                    <td><img src="Fries.jpg" alt="Fries" width="90" height="90"></td>
                    <td>Fries</td>
                    <td><input type="number" name="side_qty_fries" min="1" max="10" value="1"></td>
                </tr>
                <tr>
                    <td><input type="checkbox" name="side" value="Coleslaw"></td>
                    <td><img src="Coleslaw.jpg" alt="Coleslaw" width="90" height="90"></td>
                    <td>Coleslaw</td>
                    <td><input type="number" name="side_qty_coleslaw" min="1" max="10" value="1"></td>
                </tr>
            </table>
    </div>
</div>

    <div class="row">
    <div>
            <label for="pickup">Pickup / Delivery Date:</label>
            <input type="date" name="pickup" id="pickup">
    </div>
    </div>
            <label>Collection Method:</label>
            <div class="radio-group">
            <label><input type="radio" name="collection" value="Pickup" checked> Pickup</label>
            <label><input type="radio" name="collection" value="Delivery"> Delivery</label>
            </div>

            <label for="notes">Special Requests:</label>
            <textarea name="notes" id="notes" rows="4"></textarea>
<table>
    <tr>
        <td><input type="submit" value="Place Order"></td>
        <td><input type="reset" value="Clear Form"></td>
    </tr>
</table>

        </form>

        <hr>

        <p><a href="OrderForm.html">Back to Home</a></p>
    </div>
</body>
