
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Received — W foods</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 560px; margin: 60px auto; text-align: center; }
        
        #summary {
            margin: 20px auto;
            padding: 16px 20px;
            max-width: 420px;
            background-color: #FDF3E3;
            border: 1px solid #E7D3A8;
            border-radius: 10px;
            font-size: 1.05em;
        }
    </style>
</head>
<body>
    <h1> Thank you!</h1>
    <p>Your inquiry has been received.</p>


    <p><a href="contactform.html.html">← Back to the contact form</a></p>

    <script>
    
        const summary = document.getElementById("summary");
        if (summary) {
            const params = new URLSearchParams(window.location.search);
            const name = params.get("name");
            const email = params.get("email");
            const phone = params.get("phone");
            const inquiry = params.get("inquiry");
            summary.innerHTML = `
                <h2>inquiry Summary</h2>
                <p><strong>Name:</strong> ${name}</p>
                <p><strong>Email:</strong> ${email}</p>
                <p><strong>Phone:</strong> ${phone}</p>
                <p><strong>Inquiry:</strong> ${inquiry}</p>
            `;
        }
    </script>

</body>
</html>
